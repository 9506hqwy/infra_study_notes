---
- name: Environment Variables
  hosts: all

  environment:
    VALUE1: "Hello"

  tasks:
    - name: Ping the host
      ansible.builtin.shell:
        cmd: echo "${VALUE1}, ${VALUE2}!"
      register: result
      environment:
        VALUE2: "World"

    - name: Display result
      ansible.builtin.debug:
        msg: "{{ result.stdout }}"
